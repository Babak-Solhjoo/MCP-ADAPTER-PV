[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-adapter"
version = "0.1.0"
description = "MCP server exposing catalogs and automation adapters for MATLAB, Mathematica, COMSOL, Photoshop, OrCAD, Altium Designer, Proteus, Vivado, AutoCAD, HFSS, Simulink and draw.io, plus a time tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Babak Solhjoo"}]
keywords = ["mcp", "model-context-protocol", "matlab", "mathematica", "comsol", "vivado", "autocad", "hfss", "simulink", "drawio", "altium", "orcad", "proteus", "photoshop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=1.23,<3",             # Host/Origin (DNS-rebinding) protection on by default
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "starlette>=0.49.1",         # security floors for the HTTP transport stack pulled in by mcp
  "python-multipart>=0.0.18",
  "h11>=0.16",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pip-audit>=2.7"]
ssl = ["truststore>=0.9"]
agent = ["anthropic[mcp]>=1.7,<2", "openai>=2,<3"]

[project.scripts]
mcp-adapter = "mcp_adapter.server:main"
mcp-adapter-setup = "mcp_adapter.setup_wizard:main"
mcp-adapter-ui = "mcp_adapter.ui.server:main"
mcp-adapter-agent = "agent_runner.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_adapter*", "agent_runner*"]

[tool.setuptools.package-data]
mcp_adapter = ["catalogs/**/*.json", "ui/static/*.html", "ui/static/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B904", "UP007", "UP045", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
